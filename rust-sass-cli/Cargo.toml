[package]
name = "rust-sass-cli"
description = "Command-line compiler for rust-sass (sass CLI replacement)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rust-sass"
path = "src/main.rs"

[features]
default = ["embedded", "mimalloc"]
embedded = ["dep:rust-sass-embedded"]
async = ["rust-sass/async", "rust-sass-embedded/async"]
mimalloc = ["dep:mimalloc"]
# Forward rust-sass's `glibc-math`: `math::pow` then uses a Rust port of glibc's
# e_pow.c instead of the platform libm, so wasm (which has no libm) matches the
# native libm the spec goldens were produced against. See rust-sass/Cargo.toml.
glibc-math = ["rust-sass/glibc-math"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = { version = "0.1", optional = true }

[dependencies]
bumpalo.workspace = true
clap = { workspace = true, features = ["cargo"] }
futures.workspace = true
rust-sass-embedded = { workspace = true, optional = true }
rust-sass-macros.workspace = true
rust-sass.workspace = true
