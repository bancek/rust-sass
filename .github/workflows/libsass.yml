name: libsass

# Release pipeline for the libsass C-ABI adapter (`rust-sass-libsass`):
# per-platform `rust-sass-libsass-<version>-<triple>.zip` archives, each with
# upstream headers + shared/static libs, attached to `v*` releases.
#
# - MSVC cargo emits `sass.dll` + `sass.dll.lib` (import library, embeds the
#   DLL name — do NOT rename) + `sass.lib` (static archive): no collision,
#   top-level and hardlinked under deps/.
# - `sass.dll.lib`/`sass.lib` names are kept verbatim for the same reason.
# - musl triples ship build-gated only: a gnu runner cannot execute or
#   link-test musl binaries (no musl loader), so contract tests and the
#   sassc smoke don't apply there. Their archives are static-only, too:
#   rustc drops `cdylib` for musl targets (warning, not error), so no
#   `libsass.so` exists — the expected build warning, not a failure.
# - The stamped `sass/version.h` derives from `base.rs` (`3.6.6`, plan D2),
#   not the submodule's `[NA]` placeholder.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifacts: "libsass.so libsass.a"
            smoke: script
          - triple: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifacts: "libsass.so libsass.a"
            smoke: script
          - triple: linux-musl-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            # Static only: rustc drops `cdylib` for musl targets (warning,
            # not error), so no libsass.so exists.
            artifacts: "libsass.a"
            smoke: none
            musl: true
          - triple: linux-musl-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifacts: "libsass.a"
            smoke: none
            musl: true
          - triple: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            artifacts: "libsass.dylib libsass.a"
            smoke: script
          - triple: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            artifacts: "libsass.dylib libsass.a"
            smoke: script
          - triple: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifacts: "sass.dll sass.dll.lib sass.lib"
            smoke: msvc
            msvc_arch: x64
          - triple: win32-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifacts: "sass.dll sass.dll.lib sass.lib"
            smoke: msvc
            msvc_arch: arm64
    steps:
      # No submodules by default; smoke-tested triples init libsass+sassc below.
      - uses: actions/checkout@v7
      - name: Check out submodules for smoke tests
        if: ${{ !contains(matrix.triple, 'musl') }}
        working-directory: ${{ github.workspace }}
        run: git submodule update --init libsass sassc
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
      # TODO temporarily disabled while repo is private
      # - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build adapter (release)
        run: cargo build --release --target ${{ matrix.target }} -p rust-sass-libsass
        env:
          # Read by the `cc` crate when compiling mimalloc's C sources for
          # the musl targets; ignored for every other target.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - name: Stage adapter libraries
        run: |
          mkdir -p adapter-out
          for f in ${{ matrix.artifacts }}; do
            cp "target/${{ matrix.target }}/release/$f" adapter-out/
          done
          ls -la adapter-out/
      # Debug contract suite: validates behavior; the release artifact above
      # is what ships (a full release test run would pay LTO twice).
      - name: Contract tests (rust-impl leg)
        if: ${{ !contains(matrix.triple, 'musl') }}
        run: cargo test -p rust-sass-libsass-tests
      # NOTE: msvc-dev-cmd must come AFTER the Rust steps — otherwise bash
      # resolves `link` to Git's link.exe instead of MSVC's.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.smoke == 'msvc'
        with:
          # Must match the cargo target arch: the default x64 toolchain
          # cross-links x64 objects, which the ARM64 import lib can't satisfy
          # (LNK4272 + all symbols unresolved).
          arch: ${{ matrix.msvc_arch }}
      # Consumer smoke (MSVC): upstream sassc with its win/posix getopt shim
      # against our import library. sassc.exe needs sass.dll beside it.
      # NOTE: option prefix is `-`, not `/`: git-bash's MSYS conversion
      # rewrites every `/`-prefixed arg into a `C:/Program Files/Git/…` path.
      - name: Build sassc against our libsass (MSVC)
        if: matrix.smoke == 'msvc'
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          mkdir -p target/sassc-gate
          cl -nologo -O2 "-DSASSC_VERSION=\"$ver\"" \
            -I libsass/include -I sassc/win/posix \
            -c sassc/sassc.c sassc/win/posix/getopt.c \
            -Fotarget/sassc-gate/
          # Absolute path from cl.exe's own directory: bare `link` resolves
          # to Git's /usr/bin/link.exe (coreutils) no matter the PATH order.
          # shell32.lib: get_argv_utf8 calls CommandLineToArgvW, which
          # direct-link doesn't default.
          # NOTE: triple dir, not bare target/release — the matrix builds
          # with --target, so final artifacts land under
          # target/<triple>/release/ (top level there, hardlinked from deps/).
          MSVC_BIN="$(dirname "$(command -v cl)")"
          "$MSVC_BIN/link.exe" -nologo -OUT:target/sassc-gate/sassc.exe \
            target/sassc-gate/sassc.obj target/sassc-gate/getopt.obj \
            "target/${{ matrix.target }}/release/sass.dll.lib" shell32.lib
          cp "target/${{ matrix.target }}/release/sass.dll" target/sassc-gate/
      - name: sassc smoke test (MSVC)
        if: matrix.smoke == 'msvc'
        run: |
          ./target/sassc-gate/sassc.exe -v
          echo 'a{b:1px+2px}' | ./target/sassc-gate/sassc.exe --stdin | grep -q 3px \
            && echo "[sassc] stdin compile smoke: OK"
      # Consumer smoke (unix): the checked-in gate script (handles Darwin
      # install-name + rpath) then the same stdin check.
      - name: Build sassc against our libsass (unix)
        if: matrix.smoke == 'script'
        run: PROFILE=release rust-sass-libsass-tests/tool/build-sassc.sh
      - name: sassc smoke test (unix)
        if: matrix.smoke == 'script'
        run: |
          echo 'a{b:1px+2px}' | ./target/sassc-gate/sassc --stdin | grep -q 3px \
            && echo "[sassc] stdin compile smoke: OK"
      - name: Upload adapter libraries
        uses: actions/upload-artifact@v7
        with:
          name: libsass-${{ matrix.triple }}
          path: adapter-out/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  assemble:
    name: Assemble release archives
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        shell: bash
    permissions:
      contents: write # Tags: `gh release upload`
      id-token: write # Tags: artifact attestation
      attestations: write # Tags: attests the release archives
    steps:
      - uses: actions/checkout@v7
      # Upstream headers ship in the archives (ABI-compatible by contract).
      - name: Check out the libsass headers
        working-directory: ${{ github.workspace }}
        run: git submodule update --init libsass
      - name: Download adapter libraries
        uses: actions/download-artifact@v8
        with:
          pattern: libsass-*
          path: libsass-prebuilt
      - name: Make release archives
        # One self-contained `rust-sass-libsass-<version>-<triple>.zip` per
        # triple: `include/` (pinned headers; `sass/version.h` generated from
        # version.h.in stamped with the ABI version from base.rs, plan D2 —
        # never the submodule's `[NA]` placeholder) + `lib/` (cargo's native
        # filenames, never renamed — the import lib embeds the DLL name).
        # The header-count guard fails the run if upstream adds a header, so
        # a new API surface can't slip in unreviewed.
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          abi=$(sed -n 's/^static LIBSASS_VERSION_C.*b"\(.*\)\\0".*/\1/p' rust-sass-libsass/src/base.rs)
          test "$(ls libsass/include/sass/*.h | grep -c .)" -eq 5 || { echo "unexpected header set:"; ls libsass/include/sass/; exit 1; }
          mkdir -p libsass-archives
          for triple in linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 darwin-arm64 darwin-x64 win32-x64 win32-arm64; do
            case "$triple" in
              win32-*) libs="sass.dll sass.dll.lib sass.lib" ;;
              darwin-*) libs="libsass.dylib libsass.a" ;;
              # musl: static only (rustc drops cdylib there, so no .so).
              linux-musl-*) libs="libsass.a" ;;
              *) libs="libsass.so libsass.a" ;;
            esac
            rm -rf stage-tmp && mkdir -p stage-tmp/include/sass stage-tmp/lib
            cp libsass/include/sass.h libsass/include/sass2scss.h stage-tmp/include/
            cp libsass/include/sass/base.h libsass/include/sass/context.h \
              libsass/include/sass/functions.h libsass/include/sass/values.h \
              stage-tmp/include/sass/
            sed "s/@PACKAGE_VERSION@/$abi/" libsass/include/sass/version.h.in \
              > stage-tmp/include/sass/version.h
            for f in $libs; do
              cp "libsass-prebuilt/libsass-$triple/$f" stage-tmp/lib/
            done
            (cd stage-tmp && zip -qr "$OLDPWD/libsass-archives/rust-sass-libsass-$ver-$triple.zip" include lib)
          done
          (cd libsass-archives && sha256sum rust-sass-libsass-*.zip > "rust-sass-libsass-$ver-checksums.txt")
          ls libsass-archives
      # Per-file artifacts (each downloads as the file itself). Globs match
      # exactly one file each in a fresh libsass-archives/; misses fail the
      # run. Any run's archives are downloadable without a release.
      - name: Upload linux-x64 zip
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-libsass-linux-x64-zip
          path: libsass-archives/rust-sass-libsass-*-linux-x64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload linux-arm64 zip
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-libsass-linux-arm64-zip
          path: libsass-archives/rust-sass-libsass-*-linux-arm64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload linux-musl-x64 zip
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-libsass-linux-musl-x64-zip
          path: libsass-archives/rust-sass-libsass-*-linux-musl-x64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload linux-musl-arm64 zip
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-libsass-linux-musl-arm64-zip
          path: libsass-archives/rust-sass-libsass-*-linux-musl-arm64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload darwin-arm64 zip
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-libsass-darwin-arm64-zip
          path: libsass-archives/rust-sass-libsass-*-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload darwin-x64 zip
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-libsass-darwin-x64-zip
          path: libsass-archives/rust-sass-libsass-*-darwin-x64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload win32-x64 zip
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-libsass-win32-x64-zip
          path: libsass-archives/rust-sass-libsass-*-win32-x64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload win32-arm64 zip
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-libsass-win32-arm64-zip
          path: libsass-archives/rust-sass-libsass-*-win32-arm64.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload checksums
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-libsass-checksums
          path: libsass-archives/rust-sass-libsass-*-checksums.txt
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Attest release archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: libsass-archives/*
      - name: Check workspace version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          base="${GITHUB_REF_NAME#v}"
          base="${base%%-*}"
          if [ "$ver" != "$base" ]; then
            echo "workspace version $ver != tag base version $base"
            exit 1
          fi
      - name: Attach archives to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$GITHUB_REF_NAME" libsass-archives/* --clobber
