name: npm

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native per-arch runners throughout (mimalloc links C and each OS
          # needs its own SDK — no linux-hosted cross path). Default cargo
          # features (sync + embedded + mimalloc); glibc-math stays wasm-only.
          # `artifact` is the staged filename: distinct per triple, human-
          # usable straight from the run's artifact download.
          - triple: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: rust-sass
            artifact: rust-sass-linux-x64
          - triple: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: rust-sass
            artifact: rust-sass-linux-arm64
          # Real musl-linked builds (never relabeled gnu binaries): the musl
          # C toolchain compiles mimalloc's C sources for the musl target.
          - triple: linux-musl-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: rust-sass
            artifact: rust-sass-linux-musl-x64
            musl: true
          - triple: linux-musl-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: rust-sass
            artifact: rust-sass-linux-musl-arm64
            musl: true
          - triple: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            binary: rust-sass
            artifact: rust-sass-darwin-arm64
          - triple: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: rust-sass
            artifact: rust-sass-darwin-x64
          - triple: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: rust-sass.exe
            artifact: rust-sass-win32-x64.exe
          - triple: win32-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: rust-sass.exe
            artifact: rust-sass-win32-arm64.exe
    steps:
      # No submodules: the CLI build needs workspace crates only.
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p rust-sass-cli
        env:
          # Read by the `cc` crate when compiling mimalloc's C sources for
          # the musl targets; ignored for every other target.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - name: Stage binary under its artifact name
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "staging/${{ matrix.artifact }}"
      # Single-file artifact: the staged filename is distinct per triple, so
      # each downloads as its own `prebuilt/<artifact>/` dir without
      # unwrapping surprises. (Unarchived `archive: false` uploads fail to
      # download via the action — retries exhausted twice — so the binaries
      # ride in one-file zips; humans unzip once.)
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: staging/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      # Native musl-arm64 smoke, in the build job itself: this arm64 runner
      # executes the binary directly and inside an Alpine container (host
      # arch — no QEMU needed), proving the ubuntu+musl-gcc build is a
      # genuine working musl binary.
      - name: Native + Alpine smoke (musl arm64 binary)
        if: matrix.triple == 'linux-musl-arm64'
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          file "$bin"
          ./"$bin" --version
          docker run --rm \
            -v "$PWD/target/${{ matrix.target }}/release:/mnt:ro" \
            alpine /mnt/rust-sass --version

  assemble:
    name: Assemble npm packages
    runs-on: ubuntu-latest
    needs: [build]
    defaults:
      run:
        shell: bash
    permissions:
      contents: write # Tags: `gh release upload`
      # TODO enable
      # id-token: write # Tags: npm trusted publishing + artifact attestation
      # attestations: write # Tags: attests the release archives
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          pattern: rust-sass-*
          path: prebuilt
      - name: List prebuilt binaries
        run: |
          find prebuilt -maxdepth 2 | sort
          # Artifact zips do not preserve the exec bit; the smoke step below
          # executes the raw binaries, so restore it (platform packages get
          # their mode from build.mjs at assembly time, release archives
          # inherit that via tar/zip).
          chmod +x prebuilt/*/*
          file prebuilt/*/*
      - name: Alpine smoke (musl x64 binary)
        # The musl binary must actually run on musl, not just link: an
        # Alpine container is the true consumer path for linux-musl-x64.
        # (linux-musl-arm64 is smoked natively in its own build job: this
        # x64 runner cannot execute arm64 without QEMU emulation.)
        run: |
          docker run --rm \
            -v "$PWD/prebuilt/rust-sass-linux-musl-x64:/mnt:ro" \
            alpine /mnt/rust-sass-linux-musl-x64 --version
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          # cache disabled while the repo is private
          # cache: npm
          # cache-dependency-path: embedded-host-node-rust/package-lock.json
      - name: Install npm deps
        working-directory: embedded-host-node-rust
        run: npm ci
      - name: Assemble platform packages from prebuilt binaries
        working-directory: embedded-host-node-rust
        run: npm run build -- --platforms=all
        env:
          RUST_SASS_DIST: ${{ github.workspace }}/prebuilt
      - name: npm tests
        working-directory: embedded-host-node-rust
        run: npm test
      - name: Pack npm tarballs
        working-directory: embedded-host-node-rust
        run: |
          mkdir -p npm-tgzs
          npm pack ./dist --pack-destination ./npm-tgzs
          for triple in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 win32-x64 win32-arm64; do
            (cd "platform/$triple" && npm pack --pack-destination ../../npm-tgzs)
          done
      - name: Scratch-install smoke test
        # Runner is always ubuntu-latest (linux-x64) — no platform mapping needed.
        working-directory: embedded-host-node-rust
        run: |
          ver=$(node -p "require('./package.dist.json').version")
          pkgdir="$PWD"
          rm -rf /tmp/scratch-test && mkdir -p /tmp/scratch-test && cd /tmp/scratch-test
          npm init -y > /dev/null
          npm install "$pkgdir/npm-tgzs/sass-embedded-rust-$ver.tgz" "$pkgdir/npm-tgzs/sass-embedded-rust-linux-x64-$ver.tgz"
          node -e "const {compileString} = require('sass-embedded-rust'); const css = compileString('a{b:1px+2px}').css; if (!css.includes('3px')) throw new Error('unexpected css: ' + css); console.log('[scratch] consumer install smoke: OK')"
      - name: Make release archives
        # GitHub-release binaries, named like upstream's
        # dart-sass-<version>-<platform>-<arch> assets. Runs every push so
        # main rehearses archive naming; attached to releases on tags only.
        working-directory: embedded-host-node-rust
        run: |
          ver=$(node -p "require('./package.dist.json').version")
          mkdir -p release-archives
          archive() {
            triple="$1"; asset="$2"; ext="$3"
            src="platform/$triple/dart-sass"
            if [ "$ext" = "zip" ]; then
              (cd "$src" && zip -j "$pkgdir/release-archives/rust-sass-$ver-$asset.zip" sass.exe sass.bat)
            else
              tar -czf "$pkgdir/release-archives/rust-sass-$ver-$asset.tar.gz" -C "$src" sass
            fi
          }
          pkgdir="$PWD"
          archive darwin-arm64 macos-arm64 tar.gz
          archive darwin-x64 macos-x64 tar.gz
          archive linux-x64 linux-x64 tar.gz
          archive linux-arm64 linux-arm64 tar.gz
          archive linux-musl-x64 linux-musl-x64 tar.gz
          archive linux-musl-arm64 linux-musl-arm64 tar.gz
          archive win32-x64 windows-x64 zip
          archive win32-arm64 windows-arm64 zip
          (cd release-archives && sha256sum rust-sass-*.tar.gz rust-sass-*.zip > rust-sass-$ver-checksums.txt)
          ls release-archives
      # Per-file artifacts (one single-file glob each, zipped under its own
      # name). Globs match exactly one file each in a fresh npm-tgzs/; misses
      # fail the run. Any run's binaries and packages are downloadable
      # without a release.
      - name: Upload wrapper tgz
        uses: actions/upload-artifact@v7
        with:
          name: sass-embedded-rust-tgz
          path: embedded-host-node-rust/npm-tgzs/sass-embedded-rust-[0-9]*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload darwin-arm64 tgz
        uses: actions/upload-artifact@v7
        with:
          name: sass-embedded-rust-darwin-arm64-tgz
          path: embedded-host-node-rust/npm-tgzs/sass-embedded-rust-darwin-arm64-*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload darwin-x64 tgz
        uses: actions/upload-artifact@v7
        with:
          name: sass-embedded-rust-darwin-x64-tgz
          path: embedded-host-node-rust/npm-tgzs/sass-embedded-rust-darwin-x64-*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload linux-x64 tgz
        uses: actions/upload-artifact@v7
        with:
          name: sass-embedded-rust-linux-x64-tgz
          path: embedded-host-node-rust/npm-tgzs/sass-embedded-rust-linux-x64-*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload linux-arm64 tgz
        uses: actions/upload-artifact@v7
        with:
          name: sass-embedded-rust-linux-arm64-tgz
          path: embedded-host-node-rust/npm-tgzs/sass-embedded-rust-linux-arm64-*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload linux-musl-x64 tgz
        uses: actions/upload-artifact@v7
        with:
          name: sass-embedded-rust-linux-musl-x64-tgz
          path: embedded-host-node-rust/npm-tgzs/sass-embedded-rust-linux-musl-x64-*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload linux-musl-arm64 tgz
        uses: actions/upload-artifact@v7
        with:
          name: sass-embedded-rust-linux-musl-arm64-tgz
          path: embedded-host-node-rust/npm-tgzs/sass-embedded-rust-linux-musl-arm64-*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload win32-x64 tgz
        uses: actions/upload-artifact@v7
        with:
          name: sass-embedded-rust-win32-x64-tgz
          path: embedded-host-node-rust/npm-tgzs/sass-embedded-rust-win32-x64-*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload win32-arm64 tgz
        uses: actions/upload-artifact@v7
        with:
          name: sass-embedded-rust-win32-arm64-tgz
          path: embedded-host-node-rust/npm-tgzs/sass-embedded-rust-win32-arm64-*.tgz
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload release archives
        uses: actions/upload-artifact@v7
        with:
          name: rust-sass-binaries
          path: embedded-host-node-rust/release-archives/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Attest release archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: embedded-host-node-rust/release-archives/*
      - name: Check dist manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: embedded-host-node-rust
        run: |
          ver=$(node -p "require('./package.dist.json').version")
          base="${GITHUB_REF_NAME#v}"
          base="${base%%-*}"
          if [ "$ver" != "$base" ]; then
            echo "dist manifest version $ver != tag base version $base"
            exit 1
          fi
      - name: Attach archives and tarballs to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: embedded-host-node-rust
        run: gh release upload "$GITHUB_REF_NAME" release-archives/* npm-tgzs/*.tgz --clobber
      - name: npm publish (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: embedded-host-node-rust
        run: |
          # Prerelease tags publish under `next`, finals under `latest`.
          tag_args=""
          case "$GITHUB_REF_NAME" in *"-"*) tag_args="--tag next";; esac
          for triple in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 win32-x64 win32-arm64; do
            # publish reads package.json from cwd (--prefix does not switch it)
            (cd "platform/$triple" && npm publish --provenance $tag_args)
          done
          npm publish --provenance $tag_args ./dist
