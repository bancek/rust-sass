      - name: Check dist manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: embedded-host-node-rust
        run: |
          ver=$(node -p "require('./package.dist.json').version")
          full="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$full" ]; then
            echo "dist manifest version $ver != tag version $full"
            exit 1
          fi
      - name: Check wasm package version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: rust-sass-wasm
        run: |
          ver=$(node -p "require('./js/package.json').version")
          full="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$full" ]; then
            echo "wasm package version $ver != tag version $full"
            exit 1
          fi
      - name: Check workspace version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          full="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$full" ]; then
            echo "workspace version $ver != tag version $full"
            exit 1
          fi
      - name: Create draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Prerelease tags (a `-` suffix) stay off `latest`: the release opens
          # as draft either way — edit notes, publish when ready. Skip creation
          # when re-running: the release already exists and upload --clobber
          # refreshes its assets below.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --draft --prerelease --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --draft --latest --generate-notes
          fi
      - name: Attest CLI release archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: embedded-host-node-rust/release-archives/*
      - name: Attest libsass release archives
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: libsass-archives/*
      - name: Attach archives and tarballs to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          embedded-host-node-rust/release-archives/*
          embedded-host-node-rust/npm-tgzs/*.tgz
          prebuilt/rust-sass-wasm-tgz/*.tgz
          libsass-archives/*
          --clobber
      - name: npm publish (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: embedded-host-node-rust
        run: |
          # Prerelease tags publish under `next`, finals under `latest`.
          tag_args=""
          case "$GITHUB_REF_NAME" in *"-"*) tag_args="--tag next";; esac
          for triple in darwin-arm64 darwin-x64 linux-x64 linux-arm64 linux-musl-x64 linux-musl-arm64 win32-x64 win32-arm64; do
            # publish reads package.json from cwd (--prefix does not switch it)
            (cd "platform/$triple" && npm publish --provenance $tag_args)
          done
          npm publish --provenance $tag_args ./dist
      - name: wasm publish (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Prerelease tags publish under `next`, finals under `latest`.
          # Publishes the exact tarball build-wasm packed and scratch-smoked
          # (test-what-you-ship): tarball input is a first-class publish path
          # and --provenance attests the tarball bytes (repository.url rides
          # inside the packed package.json). Runs at the repo root — auth
          # comes from ~/.npmrc, not the cwd — since js/dist only exists on
          # the build-wasm runner.
          tag_args=""
          case "$GITHUB_REF_NAME" in *"-"*) tag_args="--tag next";; esac
          ver=$(node -p "require('./rust-sass-wasm/js/package.json').version")
          npm publish --provenance $tag_args "./prebuilt/rust-sass-wasm-tgz/rust-sass-wasm-$ver.tgz"
